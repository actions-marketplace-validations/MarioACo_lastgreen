name: lastgreen bisect
description: When CI breaks and the code did not change, find and prove which dependency, Node version or env var did it.
author: MarioACo
branding:
  icon: git-commit
  color: green

inputs:
  command:
    description: Test command to run, for example "npm test".
    required: true
  working-directory:
    description: Folder of the project (the one with package.json).
    default: .
  baseline-branch:
    description: Branch whose green runs become the baseline. Defaults to the repository default branch.
    default: ''
  github-token:
    description: Token used to read the baseline and, when enabled, comment on the PR.
    default: ${{ github.token }}
  comment-on-pr:
    description: 'Create or update a diagnosis comment on pull requests (requires pull-requests: write).'
    default: 'false'

outputs:
  result:
    description: "green, found, not-in-env, not-reproduced, nothing-testable, no-changes, budget or no-baseline"
    value: ${{ steps.why.outputs.status || steps.run.outputs.status }}
  exit-code:
    description: Exit code of the test command.
    value: ${{ steps.run.outputs.code }}
  report:
    description: Path to the Markdown diagnosis when tests fail.
    value: ${{ steps.why.outputs.report }}
  report-url:
    description: URL of the uploaded Markdown diagnosis artifact.
    value: ${{ steps.report-upload.outputs.artifact-url }}
  comment:
    description: "created, updated, failed, or empty when PR comments are disabled/not applicable"
    value: ${{ steps.comment.outputs.status }}

runs:
  using: composite
  steps:
    - name: Run tests through lastgreen
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LG: ${{ github.action_path }}/bin/lastgreen.js
        CMD: ${{ inputs.command }}
      run: |
        set +e
        node "$LG" --lang en run -- "$CMD"
        code=$?
        echo "code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" -eq 0 ]; then echo "status=green" >> "$GITHUB_OUTPUT"; else echo "status=red" >> "$GITHUB_OUTPUT"; fi
        exit 0

    - name: Save the green baseline
      if: steps.run.outputs.code == '0' && github.ref_name == (inputs.baseline-branch || github.event.repository.default_branch)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LG: ${{ github.action_path }}/bin/lastgreen.js
      run: node "$LG" --lang en export -o "$RUNNER_TEMP/lastgreen-baseline/lastgreen-baseline.json"

    - name: Upload the green baseline
      if: steps.run.outputs.code == '0' && github.ref_name == (inputs.baseline-branch || github.event.repository.default_branch)
      uses: actions/upload-artifact@v7
      with:
        name: lastgreen-baseline
        path: ${{ runner.temp }}/lastgreen-baseline/lastgreen-baseline.json
        retention-days: 90
        overwrite: true

    - name: Explain the failure
      id: why
      if: steps.run.outputs.code != '0'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LG: ${{ github.action_path }}/bin/lastgreen.js
        GH_TOKEN: ${{ inputs.github-token }}
        LASTGREEN_GITHUB_TOKEN: ${{ inputs.github-token }}
        CMD: ${{ inputs.command }}
        BRANCH: ${{ inputs.baseline-branch || github.event.repository.default_branch }}
      run: |
        dir="$RUNNER_TEMP/lastgreen-download"
        mkdir -p "$dir"
        id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=lastgreen-baseline&per_page=100" \
          --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_branch == \"$BRANCH\")] | sort_by(.created_at) | last | .id // empty" 2>/dev/null)
        if [ -z "$id" ]; then
          echo "status=no-baseline" >> "$GITHUB_OUTPUT"
          printf '### lastgreen\n\nNo green baseline from `%s` yet. It is saved on the next green run there.\n' "$BRANCH" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$dir/baseline.zip"
        unzip -o -q "$dir/baseline.zip" -d "$dir"
        unset GH_TOKEN GITHUB_TOKEN
        set +e
        node "$LG" --lang en why --against "$dir/lastgreen-baseline.json" --command "$CMD" --report "$dir/lastgreen-report.md" --json > "$dir/why.json"
        status=$(node -e "try { console.log(JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).status) } catch { console.log('error') }" "$dir/why.json")
        echo "status=$status" >> "$GITHUB_OUTPUT"
        echo "report=$dir/lastgreen-report.md" >> "$GITHUB_OUTPUT"
        echo "artifact=lastgreen-report-${GITHUB_JOB}-${RANDOM}" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Upload the diagnosis report
      id: report-upload
      if: steps.run.outputs.code != '0' && steps.why.outputs.report != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.why.outputs.artifact }}
        path: ${{ steps.why.outputs.report }}
        if-no-files-found: ignore
        retention-days: 30

    - name: Comment the diagnosis on the pull request
      id: comment
      if: steps.run.outputs.code != '0' && inputs.comment-on-pr == 'true' && github.event_name == 'pull_request' && steps.why.outputs.report != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPORT_URL: ${{ steps.report-upload.outputs.artifact-url }}
      run: |
        body="$RUNNER_TEMP/lastgreen-comment.md"
        node "$GITHUB_ACTION_PATH/scripts/pr-comment.mjs" "${{ steps.why.outputs.report }}" "$body" "$REPORT_URL"
        id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --paginate \
          --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- lastgreen-diagnosis -->"))) | .id' 2>/dev/null | tail -n 1)
        set +e
        if [ -n "$id" ]; then
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$body" >/dev/null
          code=$?
          status=updated
        else
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F "body=@$body" >/dev/null
          code=$?
          status=created
        fi
        if [ "$code" -ne 0 ]; then
          status=failed
          echo "::warning::lastgreen could not comment on PR #$PR_NUMBER. Enable pull-requests: write or leave comment-on-pr disabled."
        fi
        echo "status=$status" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Keep the test result
      if: steps.run.outputs.code != '0'
      shell: bash
      run: exit ${{ steps.run.outputs.code }}
