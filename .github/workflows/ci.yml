name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [16, 18, 20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # Node 16 has the test runner but not --test-reporter.
      - run: node --test ${{ matrix.node >= 18 && '--test-reporter=spec' || '' }}

  sandbox-benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/bench-sandbox.mjs --files 10000 --file-bytes 512

  yarn-pnp:
    strategy:
      fail-fast: false
      matrix:
        yarn: [3.8.7, 4.18.1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: corepack prepare yarn@${{ matrix.yarn }} --activate
      - run: node --test test/yarnpnp.test.js
        env:
          LASTGREEN_REAL_YARN: '1'
          LASTGREEN_YARN_VERSION: ${{ matrix.yarn }}

  yaml:
    # action.yml and the workflows must parse: a broken action.yml breaks every user's CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: |
          for f in action.yml .github/workflows/*.yml .github/dependabot.yml .github/ISSUE_TEMPLATE/*.yml; do
            npx -y js-yaml@4.1.0 "$f" > /dev/null || { echo "::error file=$f::invalid YAML"; exit 1; }
          done
